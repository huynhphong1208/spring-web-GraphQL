<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraphQL Shop - Admin Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-color: #6366f1;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            color: #f8fafc;
            min-height: 100vh;
        }

        .glass-navbar {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border);
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
        }

        .nav-tabs .nav-link {
            color: #94a3b8;
            border: none;
            border-bottom: 3px solid transparent;
            font-weight: 600;
            padding: 12px 24px;
            font-size: 1.05rem;
        }

        .nav-tabs .nav-link.active {
            color: #6366f1;
            background: transparent;
            border-bottom-color: #6366f1;
        }

        .table-dark-custom {
            --bs-table-bg: transparent;
            --bs-table-color: #f8fafc;
            border-color: var(--card-border);
        }

        .modal-content-glass {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            color: #fff;
            border-radius: 16px;
        }

        .btn-purple {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
        }
        .btn-purple:hover {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            color: white;
        }

        .img-preview-thumb {
            width: 42px;
            height: 42px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

    <!-- Admin Navbar -->
    <nav class="navbar navbar-expand-lg glass-navbar sticky-top navbar-dark py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fw-bold fs-4 text-white" href="/admin">
                <i class="fa-solid fa-user-shield me-2 text-primary"></i> Admin Dashboard
            </a>
            <div class="d-flex align-items-center gap-3">
                <a href="/" class="btn btn-outline-light rounded-pill px-4 fw-semibold">
                    <i class="fa-solid fa-store me-2"></i> Xem Cửa Hàng
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container py-4">

        <!-- Navigation Tabs -->
        <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="products-tab" data-bs-toggle="tab" data-bs-target="#products-panel" type="button" role="tab">
                    <i class="fa-solid fa-box me-2"></i>Quản Lý Sản Phẩm
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="categories-tab" data-bs-toggle="tab" data-bs-target="#categories-panel" type="button" role="tab">
                    <i class="fa-solid fa-folder me-2"></i>Quản Lý Danh Mục
                </button>
            </li>
        </ul>

        <!-- Tab Content -->
        <div class="tab-content" id="adminTabsContent">
            
            <!-- PANEL 1: PRODUCTS -->
            <div class="tab-pane fade show active" id="products-panel" role="tabpanel">
                <div class="glass-card p-4">
                    <!-- Controls Header -->
                    <div class="row g-3 align-items-center mb-4">
                        <div class="col-md-5">
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-magnifying-glass"></i></span>
                                <input type="text" id="productSearchInput" class="form-control bg-dark text-white border-secondary" placeholder="Tìm kiếm sản phẩm theo tên...">
                                <button class="btn btn-outline-secondary" type="button" onclick="searchProducts(0)">Tìm</button>
                            </div>
                        </div>
                        <div class="col-md-7 text-end">
                            <button class="btn btn-purple rounded-pill px-4" onclick="openProductModal()">
                                <i class="fa-solid fa-plus me-1"></i> Thêm Sản Phẩm Mới
                            </button>
                        </div>
                    </div>

                    <!-- Products Table -->
                    <div class="table-responsive">
                        <table class="table table-dark-custom align-middle">
                            <thead>
                                <tr class="text-secondary border-bottom border-secondary">
                                    <th>ID</th>
                                    <th>Hình Ảnh</th>
                                    <th>Tên Sản Phẩm</th>
                                    <th>Giá ($)</th>
                                    <th>Số Lượng</th>
                                    <th>Danh Mục</th>
                                    <th>Mô Tả</th>
                                    <th class="text-end">Hành Động</th>
                                </tr>
                            </thead>
                            <tbody id="productTableBody">
                                <!-- Dynamic rows -->
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <nav class="d-flex justify-content-between align-items-center mt-3">
                        <span class="text-secondary small" id="productPageInfo">Trang 1 / 1</span>
                        <ul class="pagination pagination-sm m-0" id="productPagination">
                            <!-- Dynamic pagination -->
                        </ul>
                    </nav>
                </div>
            </div>

            <!-- PANEL 2: CATEGORIES -->
            <div class="tab-pane fade" id="categories-panel" role="tabpanel">
                <div class="glass-card p-4">
                    <!-- Controls Header -->
                    <div class="row g-3 align-items-center mb-4">
                        <div class="col-md-5">
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-magnifying-glass"></i></span>
                                <input type="text" id="categorySearchInput" class="form-control bg-dark text-white border-secondary" placeholder="Tìm kiếm danh mục theo tên...">
                                <button class="btn btn-outline-secondary" type="button" onclick="searchCategories(0)">Tìm</button>
                            </div>
                        </div>
                        <div class="col-md-7 text-end">
                            <button class="btn btn-purple rounded-pill px-4" onclick="openCategoryModal()">
                                <i class="fa-solid fa-plus me-1"></i> Thêm Danh Mục Mới
                            </button>
                        </div>
                    </div>

                    <!-- Categories Table -->
                    <div class="table-responsive">
                        <table class="table table-dark-custom align-middle">
                            <thead>
                                <tr class="text-secondary border-bottom border-secondary">
                                    <th>ID</th>
                                    <th>Icon / Ảnh</th>
                                    <th>Tên Danh Mục</th>
                                    <th class="text-end">Hành Động</th>
                                </tr>
                            </thead>
                            <tbody id="categoryTableBody">
                                <!-- Dynamic rows -->
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <nav class="d-flex justify-content-between align-items-center mt-3">
                        <span class="text-secondary small" id="categoryPageInfo">Trang 1 / 1</span>
                        <ul class="pagination pagination-sm m-0" id="categoryPagination">
                            <!-- Dynamic pagination -->
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL PRODUCT -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-glass">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title fw-bold" id="productModalTitle">Thêm Sản Phẩm</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="productForm" onsubmit="saveProduct(event)">
                    <div class="modal-body">
                        <input type="hidden" id="productId">
                        
                        <div class="mb-3">
                            <label for="prodName" class="form-label text-secondary small">Tên Sản Phẩm *</label>
                            <input type="text" id="prodName" class="form-control bg-dark text-white border-secondary" required>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="prodPrice" class="form-label text-secondary small">Giá ($) *</label>
                                <input type="number" step="0.01" id="prodPrice" class="form-control bg-dark text-white border-secondary" required>
                            </div>
                            <div class="col-md-6">
                                <label for="prodQuantity" class="form-label text-secondary small">Số Lượng Kho *</label>
                                <input type="number" id="prodQuantity" class="form-control bg-dark text-white border-secondary" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="prodCategoryId" class="form-label text-secondary small">Danh Mục *</label>
                            <select id="prodCategoryId" class="form-select bg-dark text-white border-secondary" required>
                                <!-- Dynamic options -->
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="prodDescription" class="form-label text-secondary small">Mô Tả</label>
                            <textarea id="prodDescription" class="form-control bg-dark text-white border-secondary" rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="prodFileInput" class="form-label text-secondary small">Upload File Ảnh (Tùy chọn)</label>
                            <input type="file" id="prodFileInput" class="form-control bg-dark text-white border-secondary" accept="image/*">
                        </div>

                        <div class="mb-3">
                            <label for="prodImages" class="form-label text-secondary small">Hoặc Tên/URL Ảnh Có Sẵn</label>
                            <input type="text" id="prodImages" class="form-control bg-dark text-white border-secondary">
                        </div>
                    </div>
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-purple px-4">Lưu Sản Phẩm</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL CATEGORY -->
    <div class="modal fade" id="categoryModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-glass">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title fw-bold" id="categoryModalTitle">Thêm Danh Mục</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="categoryForm" onsubmit="saveCategory(event)">
                    <div class="modal-body">
                        <input type="hidden" id="categoryId">
                        
                        <div class="mb-3">
                            <label for="catName" class="form-label text-secondary small">Tên Danh Mục *</label>
                            <input type="text" id="catName" class="form-control bg-dark text-white border-secondary" required>
                        </div>

                        <div class="mb-3">
                            <label for="catFileInput" class="form-label text-secondary small">Upload File Icon (Tùy chọn)</label>
                            <input type="file" id="catFileInput" class="form-control bg-dark text-white border-secondary" accept="image/*">
                        </div>

                        <div class="mb-3">
                            <label for="catIcon" class="form-label text-secondary small">Hoặc Tên/URL Icon Có Sẵn</label>
                            <input type="text" id="catIcon" class="form-control bg-dark text-white border-secondary">
                        </div>
                    </div>
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-purple px-4">Lưu Danh Mục</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const GRAPHQL_ENDPOINT = '/graphql';
        let productModal, categoryModal;
        let categoriesList = [];

        let currentProductPage = 0;
        let currentCategoryPage = 0;
        const PAGE_SIZE = 5;

        // Core GraphQL Fetch helper supporting JSON & Multipart File Upload spec
        async function fetchGraphQL(query, variables = {}, file = null, fileVarName = 'file') {
            try {
                let response;

                if (file) {
                    // Multipart GraphQL Multipart Request Spec
                    const formData = new FormData();
                    
                    const operations = {
                        query: query,
                        variables: { ...variables, [fileVarName]: null }
                    };
                    formData.append('operations', JSON.stringify(operations));

                    const map = {
                        "0": [`variables.${fileVarName}`]
                    };
                    formData.append('map', JSON.stringify(map));
                    formData.append('0', file);

                    response = await fetch(GRAPHQL_ENDPOINT, {
                        method: 'POST',
                        body: formData
                    });
                } else {
                    // Standard JSON GraphQL POST Request
                    response = await fetch(GRAPHQL_ENDPOINT, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({ query, variables })
                    });
                }

                if (!response.ok) {
                    const text = await response.text();
                    console.error('HTTP Error Response:', response.status, text);
                    alert(`Lỗi Server (${response.status}): ${text || 'Không thể kết nối!'}`);
                    return null;
                }

                const result = await response.json();
                if (result.errors) {
                    console.error('GraphQL Errors:', result.errors);
                    alert('Lỗi GraphQL: ' + result.errors.map(e => e.message).join('\n'));
                }
                return result.data;
            } catch (error) {
                console.error('AJAX Fetch Error:', error);
                alert('Lỗi kết nối Server: ' + error.message);
                return null;
            }

        }

        // Helper to format image URL
        function getImageSrc(filename) {
            if (!filename) return 'https://via.placeholder.com/40';
            if (filename.startsWith('http://') || filename.startsWith('https://')) return filename;
            return '/uploads/' + filename;
        }

        // --- PRODUCT MANAGEMENT ---

        async function searchProducts(page = 0) {
            currentProductPage = page;
            const searchName = document.getElementById('productSearchInput').value.trim();

            const query = `
                query SearchProds($name: String, $page: Int, $size: Int) {
                    searchProducts(name: $name, page: $page, size: $size) {
                        content {
                            id
                            name
                            price
                            quantity
                            description
                            images
                            category {
                                id
                                name
                            }
                        }
                        totalPages
                        totalElements
                        pageNumber
                        pageSize
                    }
                }
            `;

            const data = await fetchGraphQL(query, {
                name: searchName || null,
                page: currentProductPage,
                size: PAGE_SIZE
            });

            if (data && data.searchProducts) {
                renderProductTable(data.searchProducts);
            }
        }

        function renderProductTable(pageData) {
            const tbody = document.getElementById('productTableBody');
            tbody.innerHTML = '';

            if (pageData.content.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-secondary">Không có sản phẩm nào</td></tr>`;
            } else {
                pageData.content.forEach(p => {
                    const tr = document.createElement('tr');
                    tr.className = 'border-bottom border-secondary border-opacity-25';
                    tr.innerHTML = `
                        <td class="fw-bold">${p.id}</td>
                        <td>
                            <img src="${getImageSrc(p.images)}" class="img-preview-thumb" onerror="this.src='https://via.placeholder.com/42?text=Image'">
                        </td>
                        <td class="fw-semibold">${p.name}</td>
                        <td class="text-success">$${p.price.toFixed(2)}</td>
                        <td><span class="badge bg-secondary">${p.quantity}</span></td>
                        <td>${p.category ? p.category.name : '-'}</td>
                        <td class="small text-secondary text-truncate" style="max-width: 180px;">${p.description || ''}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-info me-1" onclick="editProduct(${JSON.stringify(p).replace(/"/g, '&quot;')})">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${p.id}, '${p.name.replace(/'/g, "\\'")}')">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // Pagination UI
            document.getElementById('productPageInfo').textContent = `Trang ${pageData.pageNumber + 1} / ${Math.max(1, pageData.totalPages)} (Tổng ${pageData.totalElements} sản phẩm)`;
            renderPagination('productPagination', pageData.totalPages, pageData.pageNumber, searchProducts);
        }

        function openProductModal() {
            document.getElementById('productModalTitle').textContent = 'Thêm Sản Phẩm Mới';
            document.getElementById('productId').value = '';
            document.getElementById('productForm').reset();
            populateCategorySelect();
            productModal.show();
        }

        function editProduct(p) {
            document.getElementById('productModalTitle').textContent = 'Cập Nhật Sản Phẩm #' + p.id;
            document.getElementById('productId').value = p.id;
            document.getElementById('prodName').value = p.name;
            document.getElementById('prodPrice').value = p.price;
            document.getElementById('prodQuantity').value = p.quantity;
            document.getElementById('prodDescription').value = p.description || '';
            document.getElementById('prodImages').value = p.images || '';
            document.getElementById('prodFileInput').value = '';
            
            populateCategorySelect(p.category ? p.category.id : null);
            productModal.show();
        }

        async function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('productId').value;
            const fileInput = document.getElementById('prodFileInput');
            const file = fileInput.files[0] || null;

            const productInput = {
                name: document.getElementById('prodName').value,
                price: parseFloat(document.getElementById('prodPrice').value),
                quantity: parseInt(document.getElementById('prodQuantity').value),
                description: document.getElementById('prodDescription').value,
                images: document.getElementById('prodImages').value,
                categoryId: parseInt(document.getElementById('prodCategoryId').value)
            };

            if (file) {
                // Use REST Upload Endpoint for reliable file upload
                const formData = new FormData();
                formData.append('product', new Blob([JSON.stringify(productInput)], { type: 'application/json' }));
                formData.append('file', file);

                const url = id ? `/api/upload/product/update/${id}` : `/api/upload/product/create`;
                try {
                    const res = await fetch(url, { method: 'POST', body: formData });
                    if (res.ok) {
                        productModal.hide();
                        searchProducts(currentProductPage);
                    } else {
                        alert('Lỗi upload sản phẩm: ' + (await res.text()));
                    }
                } catch (err) {
                    alert('Lỗi kết nối upload: ' + err.message);
                }
            } else {
                // Use GraphQL Mutation when no file attached
                let query, variables;
                if (id) {
                    query = `
                        mutation UpdateProd($id: ID!, $input: ProductInput!) {
                            updateProduct(id: $id, product: $input) { id name images }
                        }
                    `;
                    variables = { id, input: productInput };
                } else {
                    query = `
                        mutation CreateProd($input: ProductInput!) {
                            createProduct(product: $input) { id name images }
                        }
                    `;
                    variables = { input: productInput };
                }
                const data = await fetchGraphQL(query, variables);
                if (data) {
                    productModal.hide();
                    searchProducts(currentProductPage);
                }
            }
        }

        async function deleteProduct(id, name) {
            if (!confirm(`Bạn có chắc chắn muốn xóa sản phẩm "${name}" (ID: ${id})?`)) {
                return;
            }

            const mutation = `
                mutation DelProd($id: ID!) {
                    deleteProduct(id: $id)
                }
            `;

            const data = await fetchGraphQL(mutation, { id });
            if (data && data.deleteProduct) {
                searchProducts(currentProductPage);
            } else {
                alert('Không thể xóa sản phẩm!');
            }
        }


        // --- CATEGORY MANAGEMENT ---

        async function searchCategories(page = 0) {
            currentCategoryPage = page;
            const searchName = document.getElementById('categorySearchInput').value.trim();

            const query = `
                query SearchCats($name: String, $page: Int, $size: Int) {
                    searchCategories(name: $name, page: $page, size: $size) {
                        content {
                            id
                            name
                            icon
                        }
                        totalPages
                        totalElements
                        pageNumber
                        pageSize
                    }
                }
            `;

            const data = await fetchGraphQL(query, {
                name: searchName || null,
                page: currentCategoryPage,
                size: PAGE_SIZE
            });

            if (data && data.searchCategories) {
                renderCategoryTable(data.searchCategories);
            }
        }

        function renderCategoryTable(pageData) {
            const tbody = document.getElementById('categoryTableBody');
            tbody.innerHTML = '';

            if (pageData.content.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-secondary">Không có danh mục nào</td></tr>`;
            } else {
                pageData.content.forEach(c => {
                    const tr = document.createElement('tr');
                    tr.className = 'border-bottom border-secondary border-opacity-25';
                    tr.innerHTML = `
                        <td class="fw-bold">${c.id}</td>
                        <td>
                            <img src="${getImageSrc(c.icon)}" class="img-preview-thumb" onerror="this.src='https://via.placeholder.com/42?text=Icon'">
                        </td>
                        <td class="fw-semibold">${c.name}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-info me-1" onclick="editCategory(${JSON.stringify(c).replace(/"/g, '&quot;')})">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteCategory(${c.id}, '${c.name.replace(/'/g, "\\'")}')">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // Pagination UI
            document.getElementById('categoryPageInfo').textContent = `Trang ${pageData.pageNumber + 1} / ${Math.max(1, pageData.totalPages)} (Tổng ${pageData.totalElements} danh mục)`;
            renderPagination('categoryPagination', pageData.totalPages, pageData.pageNumber, searchCategories);
        }

        function openCategoryModal() {
            document.getElementById('categoryModalTitle').textContent = 'Thêm Danh Mục Mới';
            document.getElementById('categoryId').value = '';
            document.getElementById('categoryForm').reset();
            categoryModal.show();
        }

        function editCategory(c) {
            document.getElementById('categoryModalTitle').textContent = 'Cập Nhật Danh Mục #' + c.id;
            document.getElementById('categoryId').value = c.id;
            document.getElementById('catName').value = c.name;
            document.getElementById('catIcon').value = c.icon || '';
            document.getElementById('catFileInput').value = '';
            categoryModal.show();
        }

        async function saveCategory(e) {
            e.preventDefault();
            const id = document.getElementById('categoryId').value;
            const fileInput = document.getElementById('catFileInput');
            const file = fileInput.files[0] || null;

            const categoryInput = {
                name: document.getElementById('catName').value,
                icon: document.getElementById('catIcon').value
            };

            if (file) {
                // Use REST Upload Endpoint for reliable file upload
                const formData = new FormData();
                formData.append('category', new Blob([JSON.stringify(categoryInput)], { type: 'application/json' }));
                formData.append('file', file);

                const url = id ? `/api/upload/category/update/${id}` : `/api/upload/category/create`;
                try {
                    const res = await fetch(url, { method: 'POST', body: formData });
                    if (res.ok) {
                        categoryModal.hide();
                        searchCategories(currentCategoryPage);
                        loadCategoriesList();
                    } else {
                        alert('Lỗi upload danh mục: ' + (await res.text()));
                    }
                } catch (err) {
                    alert('Lỗi kết nối upload: ' + err.message);
                }
            } else {
                // Use GraphQL Mutation when no file attached
                let query, variables;
                if (id) {
                    query = `
                        mutation UpdateCat($id: ID!, $input: CategoryInput!) {
                            updateCategory(id: $id, category: $input) { id name icon }
                        }
                    `;
                    variables = { id, input: categoryInput };
                } else {
                    query = `
                        mutation CreateCat($input: CategoryInput!) {
                            createCategory(category: $input) { id name icon }
                        }
                    `;
                    variables = { input: categoryInput };
                }
                const data = await fetchGraphQL(query, variables);
                if (data) {
                    categoryModal.hide();
                    searchCategories(currentCategoryPage);
                    loadCategoriesList();
                }
            }
        }


        async function deleteCategory(id, name) {
            if (!confirm(`Bạn có chắc chắn muốn xóa danh mục "${name}" (ID: ${id})?\nLưu ý: Sản phẩm thuộc danh mục này có thể bị ảnh hưởng.`)) {
                return;
            }

            const mutation = `
                mutation DelCat($id: ID!) {
                    deleteCategory(id: $id)
                }
            `;

            const data = await fetchGraphQL(mutation, { id });
            if (data && data.deleteCategory) {
                searchCategories(currentCategoryPage);
                loadCategoriesList();
            } else {
                alert('Không thể xóa danh mục!');
            }
        }

        // Load cached categories for Product Form select dropdown
        async function loadCategoriesList() {
            const query = `
                query {
                    allCategories {
                        id
                        name
                    }
                }
            `;
            const data = await fetchGraphQL(query);
            if (data && data.allCategories) {
                categoriesList = data.allCategories;
            }
        }

        function populateCategorySelect(selectedId = null) {
            const select = document.getElementById('prodCategoryId');
            select.innerHTML = '';
            categoriesList.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = c.name;
                if (selectedId && String(c.id) === String(selectedId)) {
                    opt.selected = true;
                }
                select.appendChild(opt);
            });
        }

        // Shared Pagination UI Generator
        function renderPagination(elementId, totalPages, currentPage, callback) {
            const ul = document.getElementById(elementId);
            ul.innerHTML = '';

            if (totalPages <= 1) return;

            // Previous button
            const prevLi = document.createElement('li');
            prevLi.className = `page-item ${currentPage === 0 ? 'disabled' : ''}`;
            prevLi.innerHTML = `<a class="page-link bg-dark text-white border-secondary" href="javascript:void(0)" onclick="${callback.name}(${currentPage - 1})">Trước</a>`;
            ul.appendChild(prevLi);

            // Page numbers
            for (let i = 0; i < totalPages; i++) {
                const li = document.createElement('li');
                li.className = `page-item ${i === currentPage ? 'active' : ''}`;
                li.innerHTML = `<a class="page-link ${i === currentPage ? 'bg-primary border-primary' : 'bg-dark text-white border-secondary'}" href="javascript:void(0)" onclick="${callback.name}(${i})">${i + 1}</a>`;
                ul.appendChild(li);
            }

            // Next button
            const nextLi = document.createElement('li');
            nextLi.className = `page-item ${currentPage === totalPages - 1 ? 'disabled' : ''}`;
            nextLi.innerHTML = `<a class="page-link bg-dark text-white border-secondary" href="javascript:void(0)" onclick="${callback.name}(${currentPage + 1})">Sau</a>`;
            ul.appendChild(nextLi);
        }

        // Initialization
        document.addEventListener('DOMContentLoaded', () => {
            productModal = new bootstrap.Modal(document.getElementById('productModal'));
            categoryModal = new bootstrap.Modal(document.getElementById('categoryModal'));

            loadCategoriesList();
            searchProducts(0);
            searchCategories(0);

            // Trigger search on Enter key press
            document.getElementById('productSearchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchProducts(0);
            });
            document.getElementById('categorySearchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchCategories(0);
            });
        });
    </script>
</body>
</html>
